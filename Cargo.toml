[package]
name = "metorex"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/metorex-lang/metorex"

[[bin]]
name = "metorex"
path = "src/main.rs"

[dependencies]
logos = "0.14.0"
libc = "0.2"
indexmap = "2"
clap = { version = "4.5", features = ["derive", "cargo"] }
thiserror = "2.0"
rustyline = "14.0"
glob = "0.3.3"
num-bigint = "0.5.1"
corosensei = "0.3.4"
serde = { version = "1", features = ["derive", "rc"] }
rmp-serde = "1.3"

[build-dependencies]
num-bigint = "0.5.1"
serde = { version = "1", features = ["derive", "rc"] }
rmp-serde = "1.3"

[dev-dependencies]

# A release build that keeps line tables, so a sampling profiler names the
# file and line each sample was taken in. `cargo build --profile profiling`
# puts it in target/profiling.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
