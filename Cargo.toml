[package]
name = "metorex"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/metorex-lang/metorex"

[[bin]]
name = "metorex"
path = "src/main.rs"

[dependencies]
logos = "0.14.0"
libc = "0.2"
indexmap = "2"
clap = { version = "4.5", features = ["derive", "cargo"] }
thiserror = "2.0"
rustyline = "14.0"
glob = "0.3.3"
num-bigint = "0.5.1"
corosensei = "0.3.4"
serde = { version = "1", features = ["derive", "rc"] }
rmp-serde = "1.3"

[build-dependencies]
num-bigint = "0.5.1"
serde = { version = "1", features = ["derive", "rc"] }
rmp-serde = "1.3"

[dev-dependencies]

# A release build that keeps line tables, so a sampling profiler names the
# file and line each sample was taken in. `cargo build --profile profiling`
# puts it in target/profiling.
# One unit optimized whole, which leaves less code for a start to touch.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# The build CI runs the RSpec and gem suites on: optimized enough that a suite
# runs about as fast as on a release build, and built incrementally, since
# CI keeps its target directory from one run to the next.
[profile.suites]
inherits = "release"
opt-level = 1
incremental = true
lto = false
codegen-units = 256
