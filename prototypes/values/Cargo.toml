# The prototypes that docs/engine/value-representation.md,
# memory-management.md, and frames-and-calls.md record. It runs one
# interpreter loop over Metorex's `Object` enum and over an 8-byte tagged
# value, compares String layouts and the C API's VALUE conversion, and lays
# out frames on the heap and in one contiguous stack. Run it with:
#
#   cargo run --release --manifest-path prototypes/values/Cargo.toml

[package]
name = "values-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
corosensei = "0.3.4"
metorex = { path = "../.." }
num-bigint = "0.5.1"

[workspace]
